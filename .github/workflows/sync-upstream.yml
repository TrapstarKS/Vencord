name: Sync upstream Vencord

# Mantém a sua main sincronizada com Vendicated:main, preservando as suas
# modificações. Merge limpo -> vai direto pra main. Deu conflito -> abre um PR
# pra você resolver na mão (nada é sobrescrito à força na main).

on:
    schedule:
        - cron: "0 6 * * *" # todo dia ~06:00 UTC (~03:00 BRT)
    workflow_dispatch: {} # botão "Run workflow" manual na aba Actions

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: sync-upstream-main
    cancel-in-progress: false

jobs:
    sync:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            GH_REPO: ${{ github.repository }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Verificar chave de sincronização
              env:
                  SYNC_SSH_KEY_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_SSH_KEY != '' }}
              run: |
                  if [[ "$SYNC_SSH_KEY_CONFIGURED" != true ]]; then
                      echo "::error::Configure UPSTREAM_SYNC_SSH_KEY com uma deploy key de escrita exclusiva deste fork para sincronizar também mudanças em workflows."
                      exit 1
                  fi

            - name: Checkout do fork
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: main
                  ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

            - name: Configurar identidade do git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Adicionar upstream e buscar
              run: |
                  git remote add upstream https://github.com/Vendicated/Vencord.git
                  git fetch upstream main

            - name: Sincronizar upstream
              id: sync
              run: bash scripts/sync-upstream.sh
